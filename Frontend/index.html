<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b22" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Aplica el último tema de temporada antes del primer pintado, para no ver
      // un instante el tema anterior. ThemeProvider lo recalcula después.
      try {
        var tema = localStorage.getItem('nlc:tema-aplicado');
        if (tema && /^[a-z]+$/.test(tema)) document.documentElement.dataset.season = tema;
        if (localStorage.getItem('nlc:animar-fondo') === 'no') document.documentElement.dataset.skyMotion = 'off';
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Nuestro Libro de Citas: guarden juntos cada cita, sus fotos y las dos versiones de la misma historia."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Nuestro Libro de Citas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
